name: Deploy

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 50

      - uses: SebRollen/toml-action@b1b3628f55fc3a28208d4203ada8b737e9687876
        id: app_name
        with:
          file: fly.toml
          field: app

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be

      # Production (main)
      - name: Deploy Production (main branch)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          flyctl deploy --remote-only --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-secret SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Staging / Secondary (any codex/* or feature/* branch)
      - name: Deploy Staging (codex/*, feature/*, or fix/*)
        if: ${{ startsWith(github.ref, 'refs/heads/codex/') || startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/fix/') }}
        run: |
          flyctl deploy --remote-only --build-arg COMMIT_SHA=${{ github.sha }} \
            --app ${{ steps.app_name.outputs.value }}-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
