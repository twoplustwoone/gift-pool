app = "gift-pool-c7cf"
primary_region = "ord"
kill_signal = "SIGINT"
# Give the Express server enough time to drain in-flight writes on deploy.
# The previous 5s was tight enough that a request mid-transaction could be
# clipped; 15s matches the default React Router stream timeout + a bit of
# slack and still keeps deploys fast.
kill_timeout = 15
processes = [ ]

[experimental]
allowed_public_ports = [ ]
auto_rollback = true

[mounts]
source = "data"
destination = "/data"

[build]
dockerfile = "/other/Dockerfile"
ignorefile = "/other/Dockerfile.dockerignore"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[[services]]
internal_port = 8080
processes = [ "app" ]
protocol = "tcp"
script_checks = [ ]
min_machines_running = 1

  [services.concurrency]
  hard_limit = 40
  soft_limit = 20
  type = "requests"

  [[services.ports]]
  handlers = [ "http" ]
  port = 80
  force_https = true

  [[services.ports]]
  handlers = [ "tls", "http" ]
  port = 443

  [[services.tcp_checks]]
  grace_period = "1s"
  interval = "15s"
  restart_limit = 0
  timeout = "2s"

  [[services.http_checks]]
  interval = "10s"
  grace_period = "5s"
  method = "get"
  path = "/resources/healthcheck"
  protocol = "http"
  timeout = "2s"
  tls_skip_verify = false
  headers = { }

  [[services.http_checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/litefs/health"
