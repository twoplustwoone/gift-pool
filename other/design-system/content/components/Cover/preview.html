<!-- @dsCard height=320 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cover</title>
    <style>
      html,
      body {
        margin: 0;
        background: var(--background);
      }
      .cv {
        position: relative;
        width: 960px;
        height: 320px;
        overflow: hidden;
        background: var(--background);
      }
      .cv svg {
        position: absolute;
        left: 0;
        top: 0;
      }
      .b-primary {
        fill: var(--primary);
      }
      .b-pool {
        fill: var(--pool);
      }
      .b-accent {
        fill: var(--accent-foreground);
      }
      .b-ink {
        fill: var(--foreground);
      }
      .b-tint {
        fill: var(--secondary);
      }
      .p-ground {
        fill: var(--background);
      }
      .p-primary {
        fill: var(--primary);
      }
      .p-pool {
        fill: var(--pool);
      }
      .cv .name {
        position: absolute;
        left: 40px;
        top: 148px;
        max-width: 880px;
        margin: 0;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 64px;
        line-height: 0.95;
        color: var(--foreground);
      }
      .cv .tag {
        position: absolute;
        left: 40px;
        top: 282px;
        margin: 0;
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 20px;
        color: var(--muted-foreground);
      }
    </style>
  </head>
  <body>
    <div class="cv">
      <!--
    blocks: primary 400x128 (bleeds top/left), pool 192x96, accent-foreground 128x96, foreground 48x48, secondary 200x128 (bleeds top/right); corners radius-2xl (16px)
    arrangement: top band, a strip of unequal blocks 0-128px tall, the name beneath (name too wide for the 440px zone)
    pattern: pills (radius-full) cut from the ground across the terracotta and tint blocks, the way stage pills and buttons sit on surfaces; Gift Pool's shape language is the full pill
    scales: pill height space-6 (24px), widths space-16 (64px) and 96px, gaps space-2 (8px), rx 12 = half the pill height
  -->
      <svg width="960" height="140" viewBox="0 0 960 140" aria-hidden="true">
        <rect
          class="b-primary"
          x="-16"
          y="-16"
          width="416"
          height="144"
          rx="16"
        />
        <rect class="b-pool" x="416" y="0" width="192" height="96" rx="16" />
        <rect class="b-accent" x="624" y="32" width="128" height="96" rx="16" />
        <rect class="b-ink" x="560" y="80" width="48" height="48" rx="24" />
        <rect class="b-tint" x="768" y="-16" width="208" height="144" rx="16" />
        <g class="p-ground">
          <rect x="24" y="24" width="96" height="24" rx="12" />
          <rect x="128" y="24" width="64" height="24" rx="12" />
          <rect x="200" y="24" width="96" height="24" rx="12" />
          <rect x="24" y="56" width="64" height="24" rx="12" />
          <rect x="96" y="56" width="96" height="24" rx="12" />
          <rect x="24" y="88" width="96" height="24" rx="12" />
          <rect x="440" y="24" width="64" height="24" rx="12" />
        </g>
        <g class="p-primary">
          <rect x="784" y="24" width="96" height="24" rx="12" />
          <rect x="888" y="24" width="64" height="24" rx="12" />
          <rect x="784" y="56" width="64" height="24" rx="12" />
        </g>
        <g class="p-pool">
          <rect x="856" y="56" width="96" height="24" rx="12" />
          <rect x="784" y="88" width="96" height="24" rx="12" />
        </g>
      </svg>
      <h1 class="name">Gift Pool<br />Design System</h1>
      <p class="tag">Joyful, familiar and quietly personal.</p>
    </div>
  </body>
</html>
