<!-- @dsCard group="Status" height=72 subtitle="Default and pool" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Badge — preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      var G = window.GiftPool,
        h = React.createElement;
      function App() {
        return h(
          'div',
          { className: 'flex flex-wrap items-center gap-3 p-4' },
          h(G.Badge, null, '3 ideas'),
          h(G.Badge, { variant: 'pool' }, 'Pool'),
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(h(App));
    </script>
  </body>
</html>
