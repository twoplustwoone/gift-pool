sonar.projectKey=twoplustwoone_gift-pool
sonar.organization=twoplustwoone

# Limit analysis to maintained source roots. Without this, SonarScanner CLI
# defaults sonar.sources to the repo root and sonar.tests to null, which causes
# co-located app tests to be treated as source files.
sonar.sources=app,server,prisma,other
sonar.tests=app,tests

# Unit tests are co-located under app/, while helpers and e2e coverage live
# under the dedicated tests/ tree.
sonar.test.inclusions=app/**/*.test.*,app/**/*.spec.*,app/**/__tests__/**,tests/**

# Generated icon artifacts are rebuilt into app/ during CI and should not be
# analyzed as source files.
sonar.exclusions=app/components/ui/icons/**

# Prisma migrations are immutable SQLite history. Sonar analyzes SQL files with
# PL/SQL rules, where repeated migration identifiers and explicit comparisons
# against Prisma's boolean columns are intentional and clearer than emulating
# constants or dialect-specific truthiness. Keep every other SQL rule active.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=prisma/migrations/**/*.sql
sonar.issue.ignore.multicriteria.e2.ruleKey=plsql:BooleanLiteralComparisonCheck
sonar.issue.ignore.multicriteria.e2.resourceKey=prisma/migrations/**/*.sql

# Vitest only produces LCOV for app/* today. Keep infrastructure and script
# code in Sonar's static analysis scope, but do not require app-style line
# coverage for those paths. `app/root.tsx` is the framework root route — it
# imports CSS, fonts, and 30+ modules, so it's covered end-to-end by every
# e2e run rather than unit-tested. The entrypoints and SEO resource routes are
# framework integration glue: keep them in static analysis, but exclude them
# from line coverage requirements.
sonar.coverage.exclusions=server/**,prisma/**,other/**,app/root.tsx,app/entry.client.tsx,app/entry.server.tsx,app/routes/_seo+/sitemap[.]xml.ts

# Path is relative to the sonar-project.properties file.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
